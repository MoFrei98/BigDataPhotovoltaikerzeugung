[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-weather-germany"
version = "0.1.0"
description = "Analyse und Prognose der normierten Photovoltaikerzeugung in Deutschland"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["pv_weather*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
